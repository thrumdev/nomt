name: Install Ubuntu Dependencies
description: "Installs dependencies on Ubuntu"

runs:
  using: "composite"
  steps:
    - name: Update apt-get
      shell: bash
      run: sudo apt-get update

    # fuser mounts without libfuse (its pure-Rust mount), so only the setuid
    # `fusermount3` helper from `fuse3` is needed; no libfuse headers.
    - name: Install FUSE
      shell: bash
      run: sudo apt-get install -y fuse3

    - name: Allow non-root users to mount FUSE filesystems
      shell: bash
      run: echo "user_allow_other" | sudo tee -a /etc/fuse.conf
