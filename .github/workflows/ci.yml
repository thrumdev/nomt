name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  nomt_test:
    name: NOMT - test
    runs-on: ubuntu-26.04
    env:
      # Avoid shrinking the inputs when an error is found in the leaf/branch stage tests.
      NO_STAGES_SHRINKING: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-fuse
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose --workspace --locked
      - run: cargo test --verbose --workspace
      # No workspace member enables these features, so `--workspace` doesn't build the decoders.
      - run: cargo test --verbose -p nomt-core --features borsh,serde
  torture:
    name: NOMT - torture
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-fuse
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p torture
      # Each workload commits, rolls back and grows the hash table, crashing the database in
      # between, and checks every value and the root against a model.
      #
      # A seed fixes the configuration of a workload, but not the moment a crash lands. These
      # seeds were picked for the features they turn on; none of them uses trickfs.
      #   6: updates, commit crashes, hash table growth with crashes
      #   7: deletions, commit crashes, rollbacks with crashes
      #   8: reads, updates, deletions, overflow values, commit crashes, rollbacks, growth
      - name: Run torture workloads
        run: |
          for seed in 6 7 8; do
            ./target/release/torture run "$seed" \
              --assigned-disk $((4 << 30)) --assigned-memory $((2 << 30)) \
              --max-iterations 20 --ensure_snapshot --workdir "$RUNNER_TEMP"
          done
      - name: Print the log of the failed workload
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP"/torture-*/log.txt
  benchtop_check:
    name: NOMT - check benchtop
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-fuse
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --verbose --manifest-path=benchtop/Cargo.toml --locked
  loom_rw_pass_cell:
    name: NOMT - loom rw_pass_cell
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: RUSTFLAGS="--cfg loom" cargo test -p nomt --release --lib rw_pass_cell
  doc:
    name: NOMT - doc
    runs-on: ubuntu-26.04
    env:
      # Treat rustdoc warnings as errors.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-fuse
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --verbose --workspace --document-private-items
  fmt:
    name: NOMT - fmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path=benchtop/Cargo.toml --check
  darwin_check:
    name: NOMT - check darwin target
    runs-on: ubuntu-26.04
    env:
      # This is a workaround for the blake3 crate.
      CARGO_FEATURE_PURE: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      # Build only the NOMT crate. Not everything builds cleanly under this configuration.
      - run: cargo check --verbose -p nomt --locked --target x86_64-apple-darwin
